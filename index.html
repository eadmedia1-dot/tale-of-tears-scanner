```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tale of Tears Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 15px;
    }

    /* ZOOM */

    .zoom-box {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      padding: 12px;
      background: #222;
      border-radius: 15px;
      border: 2px solid #444;
    }

    .zoom-title {
      font-size: 15px;
      color: #aaa;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .zoom-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }

    .zoom-button {
      width: 80px;
      height: 70px;
      border: none;
      border-radius: 14px;
      background: #8b0000;
      color: white;
      font-size: 42px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .zoom-button:active {
      transform: scale(0.92);
    }

    .zoom-label {
      min-width: 70px;
      font-size: 22px;
      font-weight: bold;
      color: white;
    }

    /* STATUS */

    #status {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background: #222;
      border-radius: 10px;
      color: #ddd;
    }

    .error {
      color: #ff7777;
    }

    .success {
      color: #72ff72;
    }

    /* RESULT */

    #result {
      display: none;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 15px;
      text-align: left;
    }

    .result-row {
      margin: 10px 0;
      font-size: 18px;
    }

    .result-label {
      color: #aaa;
    }

    .result-value {
      font-weight: bold;
      color: white;
    }

    button.action {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #8b0000;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #scanAgain {
      display: none;
      background: #333;
    }
  </style>
</head>

<body>

  <h1>Tale of Tears</h1>

  <div class="subtitle">
    Ticket Scanner
  </div>

  <div id="reader"></div>

  <!-- ZOOM BUTTONS -->

  <div class="zoom-box">

    <div class="zoom-title">
      CAMERA ZOOM
    </div>

    <div class="zoom-controls">

      <button
        type="button"
        class="zoom-button"
        onclick="changeZoom(-1)"
      >
        −
      </button>

      <div
        class="zoom-label"
        id="zoomLabel"
      >
        1.0×
      </div>

      <button
        type="button"
        class="zoom-button"
        onclick="changeZoom(1)"
      >
        +
      </button>

    </div>

  </div>

  <div id="status">
    Starting camera...
  </div>

  <div id="result">

    <div class="result-row">
      <span class="result-label">Ticket:</span>
      <span class="result-value" id="ticket"></span>
    </div>

    <div class="result-row">
      <span class="result-label">Name:</span>
      <span class="result-value" id="name"></span>
    </div>

    <div class="result-row">
      <span class="result-label">Gender:</span>
      <span class="result-value" id="gender"></span>
    </div>

    <div class="result-row">
      <span class="result-label">Priority:</span>
      <span class="result-value" id="priority"></span>
    </div>

    <div class="result-row">
      <span class="result-label">Payment:</span>
      <span class="result-value" id="payment"></span>
    </div>

    <button
      type="button"
      class="action"
      id="checkInButton"
      onclick="checkIn()"
    >
      CHECK IN
    </button>

    <button
      type="button"
      class="action"
      id="scanAgain"
      onclick="scanAgain()"
    >
      SCAN AGAIN
    </button>

  </div>


  <script>

    /*
      KEEP YOUR EXISTING APPS SCRIPT /exec URL HERE
    */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyjn5HxMjXtZ1BF1n_5HGYfqohKPeEKZf_TWXusGdbrtOpmcOPFVyEZKiA0NVy0Ylug/exec";


    let scanner;
    let scannerRunning = false;
    let currentTicket = "";

    // ZOOM VARIABLES

    let currentZoom = 1;
    let minZoom = 1;
    let maxZoom = 3;
    let zoomStep = 0.5;
    let videoTrack = null;


    // STATUS

    function showStatus(message, type = "") {

      const status =
        document.getElementById("status");

      status.textContent = message;

      status.className = type;

    }


    // START SCANNER

    async function startScanner() {

      try {

        showStatus("Starting camera...");


        /*
          SIMPLE CAMERA REQUEST
          This is the important fix.
        */

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "environment"
            }

          });


        stream
          .getTracks()
          .forEach(track => track.stop());


        scanner =
          new Html5Qrcode("reader");


        const config = {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          aspectRatio: 1.0

        };


        await scanner.start(

          "environment",

          config,

          onScanSuccess,

          onScanFailure

        );


        scannerRunning = true;


        showStatus(
          "Camera ready — scan a QR code."
        );


        /*
          Set up zoom after camera appears.
        */

        setTimeout(
          setupCameraZoom,
          1500
        );

      }


      catch (error) {

        console.error(
          "FULL CAMERA ERROR:",
          error
        );


        showStatus(

          "Camera error: " +
          (
            error?.message ||
            error?.name ||
            JSON.stringify(error)
          ),

          "error"

        );

      }

    }


    // QR SCAN

    async function onScanSuccess(decodedText) {

      if (!scannerRunning) {
        return;
      }


      currentTicket =
        decodedText.trim();


      try {

        await scanner.stop();

      }

      catch (error) {

        console.log(error);

      }


      scannerRunning = false;


      showStatus(
        "Checking ticket..."
      );


      try {

        const response =
          await fetch(

            API_URL +
            "?action=lookupTicket&ticket=" +
            encodeURIComponent(
              currentTicket
            )

          );


        const data =
          await response.json();


        if (!data.success) {

          showStatus(
            data.message ||
            "Ticket not found.",
            "error"
          );


          document.getElementById(
            "result"
          ).style.display = "none";


          document.getElementById(
            "scanAgain"
          ).style.display = "block";


          return;

        }


        showTicket(data);

      }


      catch (error) {

        console.error(error);

        showStatus(
          "Could not connect to the ticket system.",
          "error"
        );

      }

    }


    function onScanFailure(error) {
      // Normal QR scanning failures are ignored.
    }


    // SHOW TICKET

    function showTicket(data) {

      document.getElementById(
        "result"
      ).style.display = "block";


      document.getElementById(
        "ticket"
      ).textContent =
        data.ticket || "";


      document.getElementById(
        "name"
      ).textContent =
        data.name || "";


      document.getElementById(
        "gender"
      ).textContent =
        data.gender || "";


      document.getElementById(
        "priority"
      ).textContent =
        data.priority || "";


      document.getElementById(
        "payment"
      ).textContent =
        data.paymentStatus || "";


      document.getElementById(
        "scanAgain"
      ).style.display =
        "block";


      showStatus(
        "Ticket found. Check payment and press CHECK IN."
      );

    }


    // CHECK IN

    async function checkIn() {

      if (!currentTicket) {

        showStatus(
          "No ticket selected.",
          "error"
        );

        return;

      }


      const button =
        document.getElementById(
          "checkInButton"
        );


      button.disabled = true;

      button.textContent =
        "CHECKING IN...";


      try {

        const response =
          await fetch(

            API_URL +
            "?action=checkInTicket&ticket=" +
            encodeURIComponent(
              currentTicket
            )

          );


        const data =
          await response.json();


        if (data.success) {

          showStatus(
            data.message ||
            "CHECK-IN SUCCESSFUL",
            "success"
          );


          button.textContent =
            "CHECK-IN SUCCESSFUL";

        }

        else {

          showStatus(
            data.message ||
            "Check-in failed.",
            "error"
          );


          button.textContent =
            "CHECK IN";


          button.disabled = false;

        }

      }


      catch (error) {

        console.error(error);


        showStatus(
          "Could not connect to the ticket system.",
          "error"
        );


        button.textContent =
          "CHECK IN";


        button.disabled = false;

      }

    }


    // SCAN AGAIN

    async function scanAgain() {

      currentTicket = "";


      document.getElementById(
        "result"
      ).style.display =
        "none";


      const button =
        document.getElementById(
          "checkInButton"
        );


      button.disabled = false;

      button.textContent =
        "CHECK IN";


      document.getElementById(
        "scanAgain"
      ).style.display =
        "none";


      showStatus(
        "Starting scanner..."
      );


      await startScanner();

    }


    // CAMERA ZOOM SETUP

    async function setupCameraZoom() {

      try {

        const video =
          document.querySelector(
            "#reader video"
          );


        if (!video) {

          console.log(
            "Video not found yet."
          );

          return;

        }


        if (!video.srcObject) {

          console.log(
            "Video stream not ready yet."
          );

          return;

        }


        const tracks =
          video.srcObject
            .getVideoTracks();


        if (!tracks.length) {

          return;

        }


        videoTrack =
          tracks[0];


        const capabilities =
          videoTrack.getCapabilities();


        if (
          capabilities &&
          capabilities.zoom
        ) {

          minZoom =
            capabilities.zoom.min;

          maxZoom =
            capabilities.zoom.max;


          zoomStep =
            capabilities.zoom.step ||
            0.5;


          currentZoom =
            Math.max(
              minZoom,
              Math.min(
                1,
                maxZoom
              )
            );


          await videoTrack.applyConstraints({

            advanced: [
              {
                zoom: currentZoom
              }
            ]

          });


          updateZoomLabel();

        }

        else {

          /*
            Native zoom unavailable.
            Digital zoom fallback.
          */

          minZoom = 1;
          maxZoom = 3;
          zoomStep = 0.5;
          currentZoom = 1;

          updateZoomLabel();

        }

      }

      catch (error) {

        console.log(
          "Zoom setup error:",
          error
        );

      }

    }


    // CHANGE ZOOM

    async function changeZoom(direction) {

      const newZoom =
        currentZoom +
        (
          direction *
          zoomStep
        );


      currentZoom =
        Math.max(
          minZoom,
          Math.min(
            maxZoom,
            newZoom
          )
        );


      updateZoomLabel();


      /*
        Try real camera zoom first.
      */

      if (videoTrack) {

        try {

          const capabilities =
            videoTrack.getCapabilities();


          if (
            capabilities &&
            capabilities.zoom
          ) {

            await videoTrack.applyConstraints({

              advanced: [
                {
                  zoom: currentZoom
                }
              ]

            });


            return;

          }

        }

        catch (error) {

          console.log(
            "Native zoom failed:",
            error
          );

        }

      }


      /*
        Digital zoom fallback.
      */

      const video =
        document.querySelector(
          "#reader video"
        );


      if (video) {

        video.style.transform =
          `scale(${currentZoom})`;


        video.style.transformOrigin =
          "center center";

      }

    }


    // ZOOM LABEL

    function updateZoomLabel() {

      const label =
        document.getElementById(
          "zoomLabel"
        );


      if (!label) {
        return;
      }


      label.textContent =
        currentZoom.toFixed(1) +
        "×";

    }


    // PAGE LOAD

    window.addEventListener(
      "load",
      startScanner
    );

  </script>

</body>
</html>
